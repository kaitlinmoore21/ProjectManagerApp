default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: project_manager_backend_development

test:
  <<: *default
  database: project_manager_backend_test

production:
  <<: *default
  # Render provides DATABASE_URL automatically
  url: <%= ENV['DATABASE_URL'] %>

# SolidQueue uses a 'queue' connection by default
queue:
  <<: *default
  # Reuse the production database
  url: <%= ENV['DATABASE_URL'] %>

# Action Cable / SolidCable
cable:
  <<: *default
  url: <%= ENV['DATABASE_URL'] %>
