default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: project_manager_backend_development
  
  # --- REQUIRED for SolidQueue/SolidCache/ActionCable in development ---
  queue:
    <<: *default
    database: project_manager_backend_development
    
  cache:
    <<: *default
    database: project_manager_backend_development
    
  cable:
    <<: *default
    database: project_manager_backend_development

test:
  <<: *default
  database: project_manager_backend_test
  
  # --- REQUIRED for SolidQueue/SolidCache/ActionCable in test ---
  queue:
    <<: *default
    database: project_manager_backend_test
    
  cache:
    <<: *default
    database: project_manager_backend_test
    
  cable:
    <<: *default
    database: project_manager_backend_test

production:
  # The production config is correct for Render deployment
  url: <%= ENV['DATABASE_URL'] %>
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  
  cable:
    url: <%= ENV['DATABASE_URL'] %>

  queue:
    url: <%= ENV['QUEUE_DATABASE_URL'] || ENV['DATABASE_URL'] %>

  cache:
    url: <%= ENV['CACHE_DATABASE_URL'] || ENV['DATABASE_URL'] %>