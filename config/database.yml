default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: project_manager_backend_development

test:
  <<: *default
  database: project_manager_backend_test

production:
  # Render provides the full database connection string via the DATABASE_URL environment variable.
  url: <%= ENV['DATABASE_URL'] %> 
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

cable:
  url: <%= ENV['DATABASE_URL'] %> 
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>