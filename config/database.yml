default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: project_manager_backend_development

test:
  <<: *default
  database: project_manager_backend_test

production:
  # Main application database connection
  url: <%= ENV['DATABASE_URL'] %>
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

  # Secondary connections nested inside 'production'
  cable:
    url: <%= ENV['DATABASE_URL'] %>

  queue:
    url: <%= ENV['QUEUE_DATABASE_URL'] || ENV['DATABASE_URL'] %>

  cache:
    url: <%= ENV['CACHE_DATABASE_URL'] || ENV['DATABASE_URL'] %>